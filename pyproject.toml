[build-system]

requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-policy-cartpole"
version = "0.1.0"
description = "A parametrised-quantum-circuit policy for CartPole, compared against classical baselines under a controlled protocol."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "gymnasium>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pennylane>=0.40", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
